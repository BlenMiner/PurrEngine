<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tide test</title>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<pre id="log"></pre>
<script>
  // For headless web tests (see cmake/WebTest.cmake): stdout goes into #log,
  // the exit code into <body data-exit>, and a GL error stops the program.
  const log = document.getElementById('log');
  const show = text => { console.log(text); log.textContent += text + '\n'; };
  var Tide = {
    canvas: document.getElementById('canvas'),
    checkGL: !/[?&]bench\b/.test(location.search), // Timings can't: each check waits for the GPU
    arguments: location.search ? location.search.slice(1).split('&').map(a => '--' + a) : [], // ?bench is --bench
    print: show,
    printErr: show,
    onExit: code => { document.body.dataset.exit = code; },
    onAbort: reason => { show('abort: ' + reason); document.body.dataset.exit = 'abort'; },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
