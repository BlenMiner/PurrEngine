<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tide rooms test</title>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<script>
  // One of the two players web_rooms.mjs runs in a page: the query says which
  // (who), its arguments (args=host, or args=join,K7QF2M) and where the relay
  // is. Every line it prints goes to the page around it.
  const query = new URLSearchParams(location.search);
  const tell = line => {
    console.log(line);
    parent.postMessage({ who: query.get('who'), line: String(line) }, '*');
  };
  var Tide = {
    canvas: document.getElementById('canvas'),
    arguments: (query.get('args') || '').split(',').filter(Boolean),
    relay: query.get('relay'),
    iceTransportPolicy: query.get('policy') || 'all',
    print: tell,
    printErr: tell,
    onExit: code => tell('exit ' + code),
    onAbort: reason => tell('abort: ' + reason),
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
