# Builds the docs site (docs/, SvelteKit), with sand for the web in it, and
# deploys it to Fly.io (docs/fly.toml) on pushes to dev. Pull requests only
# build it, which also checks its links. It tests the editors' grammar first,
# through the Shiki the site highlights Tide with.
name: Docs

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # tools/tide-syntax/test: the grammar's scopes, on its cases and the
      # compiler's test programs.
      - name: Test the grammar
        working-directory: docs
        run: |
          npm ci
          npm run test:grammar
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build
      - uses: actions/cache@v4
        with:
          path: build/wasi-sdk-*
          key: wasi-sdk-${{ hashFiles('cmake/wasi-toolchain.cmake') }}

      # The sand page (docs/guide/sand.md) shows it at sand/.
      - name: Build sand
        run: |
          cmake --preset web-release
          cmake --build --preset web-release --target sand
          mkdir -p docs/static/sand
          cp build/web-release/bin/sand.html docs/static/sand/index.html
      - name: Build the site
        working-directory: docs
        run: |
          npm run check
          npm run build

      # The image takes what the build made (docs/Dockerfile). The token is
      # a deploy token for the app: fly tokens create deploy -a tide-website
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        working-directory: docs
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
