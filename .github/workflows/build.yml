# Builds, tests and publishes tide (see AGENTS.md, Packaging).
#
# - Pull requests: build and test on Windows, Linux and macOS.
# - Pushes to dev: also publish a nightly pre-release, like 0.2.0-nightly.3.
# - Pushes to release: also publish a stable release, and commit the new VERSION.
#
# semantic-release picks the version from conventional commits (feat:, fix:,
# see .releaserc.json). A push with neither publishes nothing. A build that
# fails on any platform fails the run, and nothing is published: every release
# has every platform's package.
name: Build

on:
  push:
    branches: [dev, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.new_release_version }}
      published: ${{ steps.next.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next version
        id: next
        if: github.event_name == 'push'
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false # The other platforms finish, so a run shows every failure
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-latest
          - platform: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TIDE_VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
      TIDE_CHANNEL: ${{ github.ref_name == 'release' && 'stable' || 'nightly' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Windows and Linux build with the LLVM tide's built-in clang comes from
      # (cmake/LLVM.cmake), which builds players' games: the runners' own is
      # older. clang-toolchain.cmake finds it through LLVM_ROOT.
      - name: LLVM version
        run: |
          version=$(sed -nE 's/^set\(TIDE_LLVM_VERSION ([0-9.]+)\).*/\1/p' cmake/LLVM.cmake)
          test -n "$version"
          echo "LLVM_VERSION=$version" >> "$GITHUB_ENV"
      # LLVM's own packages, of the same major version.
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          major=${LLVM_VERSION%%.*}
          codename=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-$major main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-$major lld-$major llvm-$major ninja-build zstd libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
          echo "LLVM_ROOT=/usr/lib/llvm-$major" >> "$GITHUB_ENV"
      # LLVM's own release, the very archive tide's package unpacks: its
      # programs and clang's headers.
      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja zstandard -y --no-progress
          name="clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc"
          mkdir -p /c/llvm
          curl -fsSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.zst" \
            | zstd -d -q --long=31 | tar -x -f - -C /c/llvm --strip-components=1 "$name/bin" "$name/lib/clang"
          echo "LLVM_ROOT=C:/llvm" >> "$GITHUB_ENV"
      # Apple's clang builds native code; web builds need Homebrew's LLVM, and its lld for wasm-ld.
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm lld zstd
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      # Web builds download wasi-sdk's C library (cmake/wasi-toolchain.cmake),
      # and MinGW builds llvm-mingw's (cmake/mingw-toolchain.cmake).
      - uses: actions/cache@v4
        with:
          path: build/wasi-sdk-*
          key: wasi-sdk-${{ hashFiles('cmake/wasi-toolchain.cmake') }}
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: build/llvm-mingw-*
          key: llvm-mingw-${{ hashFiles('cmake/mingw-toolchain.cmake') }}
      # The package builds clang and lld into tide from LLVM's release (cmake/LLVM.cmake).
      - uses: actions/cache@v4
        with:
          path: build/llvm-[0-9]*
          key: llvm-${{ runner.os }}-${{ hashFiles('cmake/LLVM.cmake') }}
      # On macOS, LLVM's libraries are bitcode, which lld compiles as it links
      # tide (minutes); its cache keeps that work between runs. Only LLVM and
      # the code that calls it decide what's in it.
      - uses: actions/cache@v4
        if: runner.os == 'macOS'
        with:
          path: build/package/lto-cache
          key: lto-${{ hashFiles('cmake/LLVM.cmake', 'compiler/cli/llvm/cc.cpp') }}
          restore-keys: lto-

      # Native tests that open a window (label gpu: the demo's smoke test, the
      # renderer's) need a GPU the runners don't have; the web ones run in
      # headless Chrome.
      - name: Test (native)
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release -LE gpu
      - name: Test (web)
        run: cmake --workflow --preset web-release
      # The target tide builds Windows games for; its platform layer goes in the package.
      - name: Test (MinGW)
        if: runner.os == 'Windows'
        run: |
          cmake --preset mingw-release
          cmake --build --preset mingw-release
          ctest --preset mingw-release -LE gpu

      # Android's tests run on its emulator, which Linux's runners accelerate
      # (KVM). Its SDK is on the runners; the emulator and its image come
      # through the SDK's manager, under Google's license.
      - name: Test (Android)
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --install emulator platform-tools "system-images;android-36;default;x86_64" > /dev/null
          echo no | "$tools/avdmanager" create avd -n tide -k "system-images;android-36;default;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd tide -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect             -no-snapshot > emulator.log 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" wait-for-device
          until [ "$("$adb" shell getprop sys.boot_completed | tr -d '')" = 1 ]; do sleep 2; done
          cmake --workflow --preset android-debug

      # The package's Android half is the platform layer for each CPU, built
      # with the runner's NDK (ANDROID_NDK_HOME).
      - name: Package
        run: |
          cmake --preset package -DTIDE_VERSION="$TIDE_VERSION" -DTIDE_CHANNEL="$TIDE_CHANNEL"
          cmake --build --preset package
          cmake --preset web-package -DTIDE_VERSION="$TIDE_VERSION" -DTIDE_CHANNEL="$TIDE_CHANNEL"
          cmake --build --preset web-package
          for abi in arm64 x86_64; do
            cmake --preset android-package-$abi
            cmake --build --preset android-package-$abi --target tide_platform raylib
          done
          cmake -DNAME=tide-${{ matrix.platform }} -P cmake/package.cmake
      # Build a game with the package, as a user would.
      - name: Try the package
        run: |
          mkdir -p build/try
          cp demo/demo.tide build/try/
          build/dist/tide/bin/tide version
          build/dist/tide/bin/tide build build/try
          build/dist/tide/bin/tide build build/try --release --web
          build/dist/tide/bin/tide build build/try --android

      - uses: actions/upload-artifact@v4
        with:
          name: tide-${{ matrix.platform }}
          path: build/dist/tide-${{ matrix.platform }}.*
          if-no-files-found: error

  # The plugin for JetBrains IDEs (tools/tide-jetbrains), checked against
  # the oldest IDE it supports and the newest CLion.
  jetbrains:
    name: JetBrains plugin
    needs: version
    runs-on: ubuntu-latest
    env:
      TIDE_VERSION: ${{ needs.version.outputs.version || '0.0.0-dev' }}
    defaults:
      run:
        shell: bash
        working-directory: tools/tide-jetbrains
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin verifyPlugin -PpluginVersion="$TIDE_VERSION"
          mv build/distributions/tide-*.zip build/distributions/tide-jetbrains.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tide-jetbrains
          path: tools/tide-jetbrains/build/distributions/tide-jetbrains.zip
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build, jetbrains]
    if: github.event_name == 'push' && needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS && cat dist/SHA256SUMS
      - name: Publish
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stable releases also go to JetBrains Marketplace, once the repository has a
  # JETBRAINS_MARKETPLACE_TOKEN secret. Nightlies don't: the plugin only runs
  # the tidels that tide installed, whichever version that is.
  marketplace:
    name: JetBrains Marketplace
    needs: [version, release]
    if: github.ref_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish
        shell: bash
        working-directory: tools/tide-jetbrains
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$JETBRAINS_MARKETPLACE_TOKEN" ]; then
            echo "No JETBRAINS_MARKETPLACE_TOKEN secret: not publishing to Marketplace."
            exit 0
          fi
          chmod +x gradlew
          ./gradlew publishPlugin -PpluginVersion="${{ needs.version.outputs.version }}"
