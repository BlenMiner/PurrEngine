<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0e14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; }
  #log { position: fixed; left: 8px; bottom: 8px; margin: 0; color: #8a8aa0; font: 12px monospace; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="return false"></canvas>
<pre id="log"></pre>
<script>
  // `?smoke` runs the automated check instead of the game (see demo/main.c).
  // Its output goes into #log, the exit code into <body data-exit>, and a GL
  // error stops it.
  const smoke = new URLSearchParams(location.search).has('smoke');
  const log = document.getElementById('log');
  function show(text) { if (smoke) log.textContent += text + '\n'; }
  var Tide = {
    canvas: document.getElementById('canvas'),
    arguments: smoke ? ['--smoke'] : [],
    checkGL: smoke,
    print: text => { console.log(text); show(text); },
    printErr: text => { console.error(text); show(text); },
    onExit: code => { document.body.dataset.exit = code; },
    onAbort: reason => { show('abort: ' + reason); document.body.dataset.exit = 'abort'; },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
