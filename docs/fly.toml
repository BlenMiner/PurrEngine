# The docs site on Fly.io, at https://tide-engine.dev. www.tide-engine.dev
# redirects there (server.js). In the domain's DNS on Cloudflare, not proxied:
# A and AAAA records for tide-engine.dev, to the app's addresses, and a CNAME
# for www to tide-website.fly.dev; certificates come from Fly (fly certs).
#
# .github/workflows/docs.yml deploys it from dev. By hand, from this folder,
# with sand copied into static/ (see AGENTS.md):
#
#   npm run build
#   fly deploy
#
# One machine stays running, so nobody waits for one to start.
app = 'tide-website'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
